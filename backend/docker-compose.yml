services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    build: .
    volumes:
      - .:/usr/src/bioAI/backend
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend
      - search
      - selenium_net
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - search
      - tasks
    volumes:
      - redis-data:/data
    ports:
    - "6379:6379"
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A bioAI worker --loglevel=info
    volumes:
      - .:/usr/src/bioAI/backend
    extra_hosts:
    - "host.docker.internal:host-gateway"
    networks:
      - tasks
      - search
      - selenium_net
    depends_on:
      - redis
      - db
  chrome:
    image: selenium/standalone-chrome:latest
    platform: linux/amd64
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: '2gb'
    networks:
      - selenium_net
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "8080:8080"  # exposed to your host machine
    volumes:
      - ./searxng:/etc/searxng:rw
    depends_on:
      - redis
    networks:
      - search
networks:
  backend:
  search:
  selenium_net:
  tasks:

volumes:
  redis-data:
  db-data: